name: Gmeek

on:
  issues:
    types:
      - opened
      - edited
      - deleted
      - closed
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      AllPost:
        description: '是否重建全部文章(输入 true 执行)'
        required: false
        default: 'false'
      PostId:
        description: '指定文章 Issue 编号（单篇重建，留空跳过）'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Blog
        uses: Meekdai/Gmeek@last
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AllPost: ${{ github.event.inputs.AllPost || 'false' }}
          PostId: ${{ github.event.inputs.PostId || '' }}

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
